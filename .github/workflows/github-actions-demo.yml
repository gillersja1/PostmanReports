name: "Newman Tests"
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML reporter
        run: npm install -g newman@6 newman-reporter-htmlextra

      # Every folder except "Known Defects"; these must all pass.
      - name: Run API tests
        run: >
          newman run "RestfulBookerBVT.postman_collection.json"
          -e Production.postman_environment.json
          --folder "Get Bookings" --folder "Get Booking by ID" --folder "Create Booking"
          --folder "Modify Booking" --folder "Patch Modify Booking" --folder Ping --folder Auth
          --reporters cli,junit,htmlextra
          --reporter-junit-export reports/junit.xml
          --reporter-htmlextra-export reports/report.html

      # Tests that assert correct behaviour but fail against Restful Booker today.
      # Non-blocking, so the defects stay visible in the reports without failing the build.
      - name: Run known-defect tests (non-blocking)
        if: always()
        continue-on-error: true
        run: >
          newman run "RestfulBookerBVT.postman_collection.json"
          -e Production.postman_environment.json
          --folder "Known Defects"
          --reporters cli,junit,htmlextra
          --reporter-junit-export reports/known-defects-junit.xml
          --reporter-htmlextra-export reports/known-defects-report.html

      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: reports/junit.xml
          suite: api
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Send known-defect results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: reports/known-defects-junit.xml
          suite: known-defects
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Newman results
          path: reports/junit.xml
          reporter: java-junit
